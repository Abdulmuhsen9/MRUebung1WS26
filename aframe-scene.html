<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>A-Frame Pflichtteil</title>
    <script src="js/vendor/aframe.min.js"></script>
  </head>
  <body>
    <a-scene background="color: #dce7ed" shadow="type: pcfsoft">
      <a-assets>
        <a-asset-item id="sunflower" src="media/gltf/sunflower/sunflower.gltf"></a-asset-item>
        <img id="box-texture" src="media/textures/cube-sea.png" alt="WebXR texture">
      </a-assets>

      <!-- Five objects above the floor. -->
      <a-box id="box" position="-3 0.6 -3" width="1.2" height="1.2" depth="1.2"
             rotation="0 20 0" src="#box-texture" shadow="cast: true; receive: false"></a-box>
      <a-sphere id="sphere" position="-1.5 0.6 -4.5" radius="0.6"
                color="#e87658" shadow="cast: true; receive: false"></a-sphere>
      <a-cylinder id="cylinder" position="0 0.65 -3" radius="0.5" height="1.3"
                  color="#579cb5" shadow="cast: true; receive: false"></a-cylinder>
      <a-cone id="cone" position="1.5 0.75 -4.5" radius-bottom="0.65" height="1.5"
              color="#ad83bb" shadow="cast: true; receive: false"></a-cone>
      <!-- Local model: Sunflower by Poly by Google (see its ATTRIBUTION.md). -->
      <a-gltf-model id="flower" src="#sunflower" position="3 0 -3" scale="2 2 2"
                    shadow="cast: true; receive: false"></a-gltf-model>

      <a-plane id="floor" position="0 0 -3" rotation="-90 0 0" width="16" height="16"
               color="#eeeeee" shadow="cast: false; receive: true"></a-plane>

      <!-- The directional light casts shadows; ambient light softens the dark sides. -->
      <a-light type="ambient" intensity="0.4"></a-light>
      <a-light id="sun" type="directional" position="-3 6 3" intensity="1"
               light="castShadow: true; shadowMapWidth: 2048; shadowMapHeight: 2048;
                      shadowCameraLeft: -9; shadowCameraRight: 9;
                      shadowCameraTop: 9; shadowCameraBottom: -9"></a-light>

      <a-entity position="0 3 2" rotation="-23 0 0">
        <a-camera position="0 0 0"></a-camera>
      </a-entity>
    </a-scene>
  </body>
</html>
